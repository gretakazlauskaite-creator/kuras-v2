name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kuras_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=kuras_test;charset=utf8mb4
      TEST_DB_USER: root
      TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, pdo_mysql
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/bootstrap-database.php
      - run: composer check

  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Check public JavaScript syntax
        run: node --check static/assets/app.js
      - name: Build from the sanitized LEA fixture
        run: php bin/build-static.php --file=tests/Fixtures/lea_prices_valid.xlsx --source-date=2026-07-17 --fixture --output=dist --archive-output=var/import-artifact
      - name: Verify generated public files
        run: |
          test -s dist/index.html
          test -s dist/data/current.json
          test -s dist/data/current.js
          test -s dist/data/status.json
          test -s dist/data/import-report.json
          test -s var/import-artifact/import-report.json
          grep -q 'data-nearby-bar' dist/index.html
          grep -q 'data-coordinate-coverage' dist/index.html
          grep -q 'data-map-legend' dist/index.html
          grep -q 'data-station-id' static/assets/app.js
          grep -q 'mapsSearchUrl' static/assets/app.js
          grep -q 'data/status.json' static/assets/app.js
          grep -q 'naujausią LEA paskelbtą datą' dist/index.html
          if grep -R -q 'GitHub' dist; then
            echo "Public site must not mention internal GitHub infrastructure."
            exit 1
          fi

  inspect-live-lea-api:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public LEA API contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept: application/json' \
            'https://api-degalukainos.ena.lt/api/v1/read/prices/latest' \
            --output /tmp/lea-latest.json
          echo "bytes=$(wc -c < /tmp/lea-latest.json)"
          jq '
            {
              root_type: type,
              root_keys: (if type == "object" then keys else [] end),
              root_length: (if type == "array" then length else null end),
              array_shapes: (
                [paths(arrays) as $path |
                  (getpath($path)) as $value |
                  {
                    path: $path,
                    length: ($value | length),
                    first_type: (if ($value | length) > 0 then ($value[0] | type) else null end),
                    first_keys: (if (($value | length) > 0 and (($value[0] | type) == "object")) then ($value[0] | keys) else [] end)
                  }
                ][0:20]
              )
            }
          ' /tmp/lea-latest.json
