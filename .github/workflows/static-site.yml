name: Fuel data and static site

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Atsisiųsti naujausius LEA duomenis'
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - 'static/**'
      - 'bin/build-static.php'
      - 'bin/build-coordinate-cache.mjs'
      - 'resources/station-coordinates.json'
      - 'src/Service/StaticDataExporter.php'
      - 'src/Service/Import/**'
      - '.github/workflows/static-site.yml'
  schedule:
    # GitHub cron uses UTC: 08:15, 11:15, 14:15 and 17:15 in Lithuania during summer.
    - cron: '15 5,8,11,14 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'static/**'
      - '!static/data/**'
      - 'bin/build-static.php'
      - 'bin/build-coordinate-cache.mjs'
      - 'resources/station-coordinates.json'
      - 'src/Service/StaticDataExporter.php'
      - 'src/Service/Import/**'
      - '.github/workflows/static-site.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip
          coverage: none
      - if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: composer install --no-interaction --prefer-dist --no-dev
      - name: Download, validate and publish latest LEA data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: php bin/build-static.php --output=dist --previous-data=static/data/current.json --archive-output=var/import-artifact
      - name: Prepare site with the last validated fuel snapshot
        if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_data)
        run: |
          test -s static/data/current.json
          test -s static/data/current.js
          mkdir -p dist
          cp -R static/. dist/
      - name: Record successful LEA source check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          mkdir -p dist/data
          php -r '$status = ["checked_at" => (new DateTimeImmutable("now", new DateTimeZone("UTC")))->format(DateTimeInterface::ATOM)]; file_put_contents("dist/data/status.json", json_encode($status, JSON_UNESCAPED_SLASHES) . PHP_EOL);'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        with:
          name: validated-snapshot
          path: |
            dist/data/current.json
            dist/data/current.js
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        with:
          name: lea-import-${{ github.run_id }}
          path: var/import-artifact
          if-no-files-found: warn
          retention-days: 90

  save-snapshot:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-snapshot
          path: var/snapshot
      - name: Save the latest validated snapshot in GitHub
        continue-on-error: true
        run: |
          cp var/snapshot/current.json static/data/current.json
          cp var/snapshot/current.js static/data/current.js
          git config user.name "kuras-data-bot"
          git config user.email "kuras-data-bot@users.noreply.github.com"
          git add static/data/current.json static/data/current.js
          git diff --cached --quiet || git commit -m "Update LEA fuel prices [skip ci]"
          git push

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
