name: Inspect live LEA API

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect portal API configuration safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lea-assets
          curl --fail --silent --show-error --location \
            'https://degalukainos.ena.lt/' \
            --output /tmp/lea-assets/index.html

          python3 <<'PY'
          import pathlib, re, subprocess

          root = pathlib.Path('/tmp/lea-assets')
          origin = 'https://degalukainos.ena.lt'
          queue = []
          seen = set()

          def discover(text):
              for path in re.findall(r'(?:https://degalukainos\.ena\.lt)?(/assets/[A-Za-z0-9._-]+\.js)', text):
                  if path not in seen and path not in queue:
                      queue.append(path)

          discover((root / 'index.html').read_text(errors='ignore'))
          while queue and len(seen) < 30:
              path = queue.pop(0)
              seen.add(path)
              target = root / pathlib.Path(path).name
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', origin + path, '--output', str(target)], check=True)
              discover(target.read_text(errors='ignore'))

          print('assets=' + ','.join(sorted(p.name for p in root.glob('*.js'))))
          needles = ('prices/latest', 'Authorization', 'authorization', 'Bearer', 'api-degalukainos')
          for file in sorted(root.glob('*.js')):
              text = file.read_text(errors='ignore')
              for needle in needles:
                  pos = text.find(needle)
                  if pos < 0:
                      continue
                  context = text[max(0, pos - 500):pos + 800]
                  context = re.sub(r'(?<!https://)([A-Za-z0-9_.-]{28,})', '<redacted-long-value>', context)
                  print(f'--- {file.name} :: {needle} ---')
                  print(context)
          PY
